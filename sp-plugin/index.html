<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Keep List Sync</title>
    <style>
      body {
        padding: var(--s3);
        max-width: 480px;
      }
      h1 {
        font-size: 1.1rem;
        margin-bottom: var(--s2);
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: var(--s3);
        margin-bottom: var(--s-half);
      }
      select,
      input[type='number'],
      input[type='text'] {
        width: 100%;
      }
      .row {
        display: flex;
        gap: var(--s2);
        margin-top: var(--s3);
      }
      .row button {
        flex: 1;
      }
      #statusBox {
        margin-top: var(--s3);
        padding: var(--s2);
      }
      #statusBox.err {
        color: var(--c-warn);
      }
      details {
        margin-top: var(--s3);
      }
      details summary {
        cursor: pointer;
        color: var(--text-color-muted);
      }
    </style>
  </head>
  <body>
    <h1>Google Keep List Sync</h1>
    <p class="text-muted">
      Picks a Keep checklist (produced by the keep-sync-daemon companion
      script) and syncs its items into a Super Productivity project.
    </p>

    <label for="noteSelect">Keep list</label>
    <select id="noteSelect"></select>

    <label for="projectSelect">Super Productivity project</label>
    <select id="projectSelect"></select>

    <label for="intervalInput">Sync every (minutes)</label>
    <input type="number" id="intervalInput" min="1" value="5" />

    <details>
      <summary>Advanced: custom state file path</summary>
      <label for="statePathInput">state.json path (leave blank for default)</label>
      <input type="text" id="statePathInput" placeholder="~/.sp-keep-sync/state.json" />
    </details>

    <div class="row">
      <button id="saveBtn" class="btn-primary">Save</button>
      <button id="syncNowBtn" class="btn-outline">Sync now</button>
    </div>

    <div id="statusBox" class="card"></div>

    <script>
      const noteSelect = document.getElementById('noteSelect');
      const projectSelect = document.getElementById('projectSelect');
      const intervalInput = document.getElementById('intervalInput');
      const statePathInput = document.getElementById('statePathInput');
      const statusBox = document.getElementById('statusBox');

      function readStateScript(customPath) {
        const pathExpr = customPath
          ? JSON.stringify(customPath)
          : "require('path').join(require('os').homedir(), '.sp-keep-sync', 'state.json')";
        return `
          const fs = require('fs');
          const statePath = ${pathExpr};
          if (!fs.existsSync(statePath)) {
            return { ok: false, error: 'not_found', path: statePath };
          }
          try {
            const raw = fs.readFileSync(statePath, 'utf8');
            return { ok: true, data: JSON.parse(raw) };
          } catch (e) {
            return { ok: false, error: String((e && e.message) || e) };
          }
        `;
      }

      async function loadNotes(customPath) {
        noteSelect.innerHTML = '<option value="">Loading…</option>';
        try {
          const res = await PluginAPI.executeNodeScript({
            script: readStateScript(customPath),
            timeout: 8000,
          });
          if (!res || !res.success) {
            noteSelect.innerHTML = '<option value="">(node script failed)</option>';
            return;
          }
          const payload = res.result;
          if (!payload || !payload.ok) {
            noteSelect.innerHTML = '<option value="">(no data yet — run the daemon)</option>';
            return;
          }
          const notes = payload.data.notes || [];
          if (notes.length === 0) {
            noteSelect.innerHTML = '<option value="">(no checklists found)</option>';
            return;
          }
          noteSelect.innerHTML = notes
            .map((n) => `<option value="${escapeAttr(n.title)}">${escapeHtml(n.title)} (${n.items.length})</option>`)
            .join('');
        } catch (e) {
          noteSelect.innerHTML = '<option value="">(error loading list)</option>';
          console.error('[keep-list-sync] loadNotes failed', e);
        }
      }

      async function loadProjects() {
        const projects = await PluginAPI.getAllProjects();
        const active = projects.filter((p) => !p.isArchived);
        projectSelect.innerHTML = active
          .map((p) => `<option value="${escapeAttr(p.id)}">${escapeHtml(p.title)}</option>`)
          .join('');
      }

      async function loadConfig() {
        const raw = await PluginAPI.loadSyncedData('config');
        return raw ? JSON.parse(raw) : {};
      }

      async function loadStatus() {
        const raw = await PluginAPI.loadSyncedData('status');
        if (!raw) {
          statusBox.textContent = 'Not synced yet.';
          statusBox.className = 'card';
          return;
        }
        const s = JSON.parse(raw);
        const when = new Date(s.at).toLocaleString();
        if (s.ok) {
          statusBox.textContent = `Last sync ${when}: "${s.noteTitle}" — ${s.itemCount} item(s), ${s.created} created, ${s.updated} updated.`;
          statusBox.className = 'card';
        } else {
          statusBox.textContent = `Last attempt ${when} failed: ${s.error}`;
          statusBox.className = 'card err';
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function escapeAttr(s) {
        return escapeHtml(s);
      }

      async function init() {
        const cfg = await loadConfig();
        statePathInput.value = cfg.statePath || '';
        intervalInput.value = cfg.intervalMinutes || 5;

        await Promise.all([loadNotes(cfg.statePath), loadProjects()]);

        if (cfg.noteTitle) noteSelect.value = cfg.noteTitle;
        if (cfg.projectId) projectSelect.value = cfg.projectId;

        await loadStatus();
      }

      document.getElementById('saveBtn').addEventListener('click', async () => {
        const cfg = {
          noteTitle: noteSelect.value,
          projectId: projectSelect.value,
          intervalMinutes: Math.max(1, parseInt(intervalInput.value, 10) || 5),
          statePath: statePathInput.value.trim() || undefined,
        };
        if (!cfg.noteTitle || !cfg.projectId) {
          PluginAPI.showSnack({ msg: 'Pick a Keep list and a project first', type: 'WARNING' });
          return;
        }
        await PluginAPI.persistDataSynced(JSON.stringify(cfg), 'config');
        PluginAPI.showSnack({ msg: 'Saved. Syncing…', type: 'SUCCESS' });
      });

      document.getElementById('syncNowBtn').addEventListener('click', async () => {
        // Bumping any synced key fires PERSISTED_DATA_CHANGED in plugin.js,
        // which re-reads config and runs a sync — see plugin.js for why the
        // sync logic itself lives there instead of being duplicated here.
        await PluginAPI.persistDataSynced(String(Date.now()), 'syncRequest');
        PluginAPI.showSnack({ msg: 'Sync requested…', type: 'INFO' });
        setTimeout(loadStatus, 1500);
      });

      init();
    </script>
  </body>
</html>
