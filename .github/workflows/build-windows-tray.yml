name: Build tray app

on:
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keep-sync-daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt

      - name: Build exe
        run: >-
          pyinstaller --onefile --windowed --name KeepSyncTray
          --copy-metadata gpsoauth --copy-metadata gkeepapi
          keep_sync_tray.py

      - name: Self-test the built exe
        timeout-minutes: 3
        env:
          KEEP_SYNC_TRAY_SELFTEST: "1"
        # A --windowed (GUI-subsystem) exe isn't reliably waited on by
        # PowerShell's native-command invocation, so $LASTEXITCODE can be
        # checked before it actually finishes. Start-Process -Wait -PassThru
        # blocks on the process handle directly and gives a trustworthy exit code.
        # -Wait can hang forever if the exe pops a modal error dialog, so this
        # step has its own short timeout on top of the job one.
        run: |
          $proc = Start-Process -FilePath ".\dist\KeepSyncTray.exe" -Wait -PassThru `
            -RedirectStandardOutput selftest-stdout.log -RedirectStandardError selftest-stderr.log
          Get-Content selftest-stdout.log, selftest-stderr.log -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            throw "KeepSyncTray.exe self-test exited with code $($proc.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: KeepSyncTray
          path: keep-sync-daemon/dist/KeepSyncTray.exe
          if-no-files-found: error

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keep-sync-daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's xcb/offscreen platform plugins dynamically link these even
      # when there's no real display (as in this headless self-test).
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-linux.txt

      - name: Build binary
        run: >-
          pyinstaller --onefile --name KeepSyncTrayQt
          --copy-metadata gpsoauth --copy-metadata gkeepapi
          keep_sync_tray_qt.py

      - name: Self-test the built binary
        env:
          KEEP_SYNC_TRAY_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: ./dist/KeepSyncTrayQt

      - uses: actions/upload-artifact@v4
        with:
          name: KeepSyncTrayQt
          path: keep-sync-daemon/dist/KeepSyncTrayQt
          if-no-files-found: error
