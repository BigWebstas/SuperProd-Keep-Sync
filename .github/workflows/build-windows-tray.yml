name: Build Windows tray exe

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: keep-sync-daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name KeepSyncTray keep_sync_tray.py

      - name: Self-test the built exe
        env:
          KEEP_SYNC_TRAY_SELFTEST: "1"
        run: .\dist\KeepSyncTray.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KeepSyncTray
          path: keep-sync-daemon/dist/KeepSyncTray.exe
          if-no-files-found: error
