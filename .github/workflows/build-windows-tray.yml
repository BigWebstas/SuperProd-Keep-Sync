name: Build tray app

on:
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keep-sync-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for `git describe` in the version stamp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-windows.txt

      - name: Stamp version
        run: |
          python -c "import subprocess,pathlib; v=subprocess.run(['git','describe','--tags','--always'],capture_output=True,text=True).stdout.strip() or 'unknown'; pathlib.Path('_keep_sync_version.py').write_text('__version__ = %r\n' % v); print('version:', v)"

      - name: Build exe
        run: >-
          pyinstaller --onefile --windowed --name KeepSyncTray
          --copy-metadata gpsoauth --copy-metadata gkeepapi
          --hidden-import _keep_sync_version
          keep_sync_tray.py

      # Diagnostic: a "STATUS_BREAKPOINT" (0x80000003) crash in _json in the
      # frozen build classically means a debug-built binary got bundled.
      # A throwaway --onedir build lets us look.
      - name: Inspect the bundle for debug binaries
        continue-on-error: true
        run: |
          python -c "import sys,_json,_ssl; print('python', sys.version); print('_json', _json.__file__); print('_ssl', _ssl.__file__)"
          pyinstaller --onedir --windowed --name _inspect --hidden-import _keep_sync_version keep_sync_tray.py 2>&1 | Out-Null
          $sus = Get-ChildItem -Recurse dist\_inspect -Include *_d.pyd,*_d.dll,python*_d.dll,ucrtbased.dll,vcruntime*d.dll,msvcp*d.dll -ErrorAction SilentlyContinue
          if ($sus) { Write-Host "SUSPECT DEBUG BINARIES:"; $sus | ForEach-Object { $_.FullName } }
          else { Write-Host "no obviously-debug binaries in the bundle" }
          Get-ChildItem dist\_inspect\_internal -Filter *.pyd | Select-Object Name,Length | Format-Table -AutoSize
          Remove-Item -Recurse -Force dist\_inspect,build\_inspect -ErrorAction SilentlyContinue

      - name: Self-test the built exe
        timeout-minutes: 3
        env:
          KEEP_SYNC_TRAY_SELFTEST: "1"
        # A --windowed (GUI-subsystem) exe has no reliable console stdio and
        # can pop a modal error dialog that blocks forever, so: start it
        # detached, wait with our own timeout, kill it if it overruns, and
        # ALWAYS dump every log (the redirected streams plus the app's own
        # keep_sync_tray.log / .fault.log) so a hang is still diagnosable.
        run: |
          $proc = Start-Process -FilePath ".\dist\KeepSyncTray.exe" -PassThru `
            -RedirectStandardOutput selftest-stdout.log -RedirectStandardError selftest-stderr.log
          $done = $proc.WaitForExit(90000)
          if (-not $done) { try { $proc.Kill($true) } catch {} }
          Write-Host "=== selftest-stdout.log ==="
          Get-Content selftest-stdout.log -ErrorAction SilentlyContinue
          Write-Host "=== selftest-stderr.log ==="
          Get-Content selftest-stderr.log -ErrorAction SilentlyContinue
          Write-Host "=== dist\keep_sync_tray.log ==="
          Get-Content dist\keep_sync_tray.log -ErrorAction SilentlyContinue
          Write-Host "=== dist\keep_sync_tray.fault.log ==="
          Get-Content dist\keep_sync_tray.fault.log -ErrorAction SilentlyContinue
          if (-not $done) { throw "KeepSyncTray.exe self-test did not exit within 90s" }
          if ($proc.ExitCode -ne 0) {
            throw "KeepSyncTray.exe self-test exited with code $($proc.ExitCode)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: KeepSyncTray
          path: keep-sync-daemon/dist/KeepSyncTray.exe
          if-no-files-found: error

  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keep-sync-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for `git describe` in the version stamp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's xcb/offscreen platform plugins dynamically link these even
      # when there's no real display (as in this headless self-test).
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements-linux.txt

      - name: Stamp version
        run: |
          python -c "import subprocess,pathlib; v=subprocess.run(['git','describe','--tags','--always'],capture_output=True,text=True).stdout.strip() or 'unknown'; pathlib.Path('_keep_sync_version.py').write_text('__version__ = %r\n' % v); print('version:', v)"

      - name: Build binary
        run: >-
          pyinstaller --onefile --name KeepSyncTrayQt
          --copy-metadata gpsoauth --copy-metadata gkeepapi
          --hidden-import _keep_sync_version
          keep_sync_tray_qt.py

      - name: Self-test the built binary
        env:
          KEEP_SYNC_TRAY_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: ./dist/KeepSyncTrayQt

      - uses: actions/upload-artifact@v4
        with:
          name: KeepSyncTrayQt
          path: keep-sync-daemon/dist/KeepSyncTrayQt
          if-no-files-found: error
